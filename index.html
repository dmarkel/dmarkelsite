<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>David Markel — Interactive Resume</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #111; color: #fff;
      font-family: monospace; font-size: 24px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading...</div>
  <canvas id="game"></canvas>
  <script>
    // ── CONSTANTS ────────────────────────────────────────────────────
    const SPRITE_COLS  = 5;
    const SPRITE_ROWS  = 3;
    const FRAME_W      = 1536 / SPRITE_COLS;   // 307.2
    const FRAME_H      = 1024 / SPRITE_ROWS;   // 341.33
    const CHAR_SCALE   = 0.38;
    const CHAR_W       = Math.round(FRAME_W * CHAR_SCALE);  // ~117px displayed
    const CHAR_H       = Math.round(FRAME_H * CHAR_SCALE);  // ~130px displayed

    const GRAVITY      = 0.5;    // px/frame² at 60fps
    const JUMP_VY      = -12;    // px/frame at 60fps (negative = upward)
    const WALK_SPEED   = 4;      // px/frame at 60fps
    const ANIM_FPS     = 8;      // walk/crouch cycle speed
    const GROUND_FRAC  = 0.83;   // feet Y as fraction of canvas height

    const ANIM = {
      walk:   { row: 0, frames: 5 },
      jump:   { row: 1, frames: 3 },
      crouch: { row: 2, frames: 3 },
    };

    // ── UTILITIES ────────────────────────────────────────────────────
    function clamp(v, lo, hi) {
      return v < lo ? lo : v > hi ? hi : v;
    }

    function getAnimFrame(frameCount, elapsed, fps) {
      return Math.floor(elapsed * fps) % frameCount;
    }

    // Returns the leftmost canvas X at which to start drawing tiled parallax layer.
    // Loop: for (let x = result; x < canvasW; x += scaledImgW)
    function getParallaxDrawX(cameraX, speed, scaledImgW) {
      const offset = cameraX * speed;
      return ((-offset % scaledImgW) + scaledImgW) % scaledImgW - scaledImgW;
    }

    // ── BOOTSTRAP ────────────────────────────────────────────────
    const canvas = document.getElementById('game');
    const ctx    = canvas.getContext('2d');
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;

    const bgImg     = new Image();
    const spriteImg = new Image();
    let   loadedCount = 0;

    function onImageLoad() {
      if (++loadedCount < 2) return;
      document.getElementById('loading').style.display = 'none';
      init();
    }

    bgImg.onload     = onImageLoad;
    spriteImg.onload = onImageLoad;
    bgImg.onerror    = () => { document.getElementById('loading').textContent = 'Error loading background'; };
    spriteImg.onerror = () => { document.getElementById('loading').textContent = 'Error loading sprite'; };
    bgImg.src        = 'img/1 Houston.png';
    spriteImg.src    = 'img/dmarkel_sprite_sheet.png';

    function init() {
      // Game systems wired up in later tasks — placeholder for now
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '20px monospace';
      ctx.fillText('Images loaded — game coming soon', 40, 80);
    }
  </script>
</body>
</html>
