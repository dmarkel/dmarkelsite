<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>David Markel — Interactive Resume</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #111; color: #fff;
      font-family: monospace; font-size: 24px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading...</div>
  <canvas id="game"></canvas>
  <script>
    // ── BOOTSTRAP ────────────────────────────────────────────────
    const canvas = document.getElementById('game');
    const ctx    = canvas.getContext('2d');
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;

    const bgImg     = new Image();
    const spriteImg = new Image();
    let   loadedCount = 0;

    function onImageLoad() {
      if (++loadedCount < 2) return;
      document.getElementById('loading').style.display = 'none';
      init();
    }

    bgImg.onload     = onImageLoad;
    spriteImg.onload = onImageLoad;
    bgImg.onerror    = () => { document.getElementById('loading').textContent = 'Error loading background'; };
    spriteImg.onerror = () => { document.getElementById('loading').textContent = 'Error loading sprite'; };
    bgImg.src        = 'img/1 Houston.png';
    spriteImg.src    = 'img/dmarkel_sprite_sheet.png';

    function init() {
      // Game systems wired up in later tasks — placeholder for now
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '20px monospace';
      ctx.fillText('Images loaded — game coming soon', 40, 80);
    }
  </script>
</body>
</html>
