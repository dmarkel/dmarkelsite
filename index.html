<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="David Markel — Interactive Resume Game">
  <link rel="icon" href="data:,">
  <title>David Markel — Interactive Resume</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #111; color: #fff;
      font-family: monospace; font-size: 24px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading...</div>
  <canvas id="game"></canvas>
  <script>
    // ── CONSTANTS ────────────────────────────────────────────────────
    const CHAR_W       = 114;    // displayed width (px)
    const CHAR_H       = 130;    // displayed height (px)

    const GRAVITY      = 0.5;    // px/frame² at 60fps
    const JUMP_VY      = -12;    // px/frame at 60fps (negative = upward)
    const WALK_SPEED   = 4;      // px/frame at 60fps
    const ANIM_FPS     = 8;      // walk/crouch cycle speed
    const GROUND_FRAC  = 0.83;   // feet Y as fraction of canvas height

    // Populated in bootstrap after all frame images have loaded
    const FRAMES = { walk: [], jump: [], crouch: [] };

    // ── UTILITIES ────────────────────────────────────────────────────
    function clamp(v, lo, hi) {
      return v < lo ? lo : v > hi ? hi : v;
    }

    function getAnimFrame(frameCount, elapsed, fps) {
      return Math.floor(elapsed * fps) % frameCount;
    }

    // Returns the leftmost canvas X at which to start drawing tiled parallax layer.
    // Loop: for (let x = result; x < canvasW; x += scaledImgW)
    function getParallaxDrawX(cameraX, speed, scaledImgW) {
      const offset = cameraX * speed;
      return ((-offset % scaledImgW) + scaledImgW) % scaledImgW - scaledImgW;
    }

    // ── INPUT ────────────────────────────────────────────────────────
    const keys = { left: false, right: false, up: false, down: false };

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  { keys.left  = true; e.preventDefault(); }
      if (e.key === 'ArrowRight') { keys.right = true; e.preventDefault(); }
      if (e.key === 'ArrowUp')    { keys.up    = true; e.preventDefault(); }
      if (e.key === 'ArrowDown')  { keys.down  = true; e.preventDefault(); }
    });

    document.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft')  keys.left  = false;
      if (e.key === 'ArrowRight') keys.right = false;
      if (e.key === 'ArrowUp')    keys.up    = false;
      if (e.key === 'ArrowDown')  keys.down  = false;
    });

    // ── WORLD ────────────────────────────────────────────────────────
    // Defined inside init() once images are loaded — see BOOTSTRAP.
    // Shape: { image, width, layers: [{ srcYStart, srcYEnd, speed }] }
    let WORLD;

    // ── RENDER ───────────────────────────────────────────────────────
    function renderLayer(ctx, img, layer, cameraX, canvasW, canvasH) {
      const bgScale   = canvasH / 1024;
      const scaledBgW = Math.ceil(1536 * bgScale);
      const srcY      = layer.srcYStart * 1024;
      const srcH      = (layer.srcYEnd - layer.srcYStart) * 1024;
      const destY     = layer.srcYStart * canvasH;
      const destH     = (layer.srcYEnd - layer.srcYStart) * canvasH;
      const startX    = getParallaxDrawX(cameraX, layer.speed, scaledBgW);
      for (let x = startX; x < canvasW; x += scaledBgW) {
        ctx.drawImage(img, 0, srcY, 1536, srcH, x, destY, scaledBgW, destH);
      }
    }

    function renderWorld(ctx, zone, cameraX, canvasW, canvasH) {
      for (const layer of zone.layers) {
        renderLayer(ctx, zone.image, layer, cameraX, canvasW, canvasH);
      }
    }

    function renderPlayer(ctx, player, cameraX, canvasH) {
      const screenX  = Math.round(player.x - cameraX);
      const screenY  = Math.round(player.y - CHAR_H);  // player.y = feet; moves up when jumping

      const animKey  = player.animState === 'idle' ? 'walk' : player.animState;
      const frameArr = FRAMES[animKey] || FRAMES.walk;
      const frameIdx = player.animState === 'idle'
        ? 0
        : getAnimFrame(frameArr.length, player.animElapsed, ANIM_FPS);
      const img = frameArr[frameIdx];

      ctx.save();
      if (player.facingLeft) {
        ctx.translate(screenX + CHAR_W, screenY);
        ctx.scale(-1, 1);
        ctx.drawImage(img, 0, 0, CHAR_W, CHAR_H);
      } else {
        ctx.drawImage(img, screenX, screenY, CHAR_W, CHAR_H);
      }
      ctx.restore();
    }

    // ── PLAYER ───────────────────────────────────────────────────────
    function createPlayer(groundY) {
      return {
        x:            200,       // world x — left edge of displayed sprite
        y:            groundY,   // world y — feet (bottom of displayed sprite)
        vy:           0,         // vertical velocity (px/frame at 60fps)
        grounded:     true,
        facingLeft:   false,
        jumpConsumed: false,     // prevents hold-to-multijump
        animState:    'idle',
        animElapsed:  0,         // seconds since current anim started
      };
    }

    function getAnimState(player, keys) {
      if (!player.grounded)         return 'jump';
      if (keys.down)                return 'crouch';
      if (keys.left || keys.right)  return 'walk';
      return 'idle';
    }

    function updatePlayer(player, keys, dt, groundY, worldWidth) {
      const dtf = dt * 60;  // normalize physics to 60fps feel

      // Horizontal movement (disabled while crouching)
      let vx = 0;
      if (!keys.down) {
        if (keys.left)  { vx = -WALK_SPEED; player.facingLeft = true;  }
        if (keys.right) { vx =  WALK_SPEED; player.facingLeft = false; }
      }
      player.x = clamp(player.x + vx * dtf, 0, worldWidth - CHAR_W);

      // Jump — one-shot, grounded only, prevents re-trigger while key held
      if (keys.up && player.grounded && !player.jumpConsumed) {
        player.vy           = JUMP_VY;
        player.grounded     = false;
        player.jumpConsumed = true;
      }
      if (!keys.up) player.jumpConsumed = false;

      // Gravity + vertical integration
      if (!player.grounded) {
        player.vy += GRAVITY * dtf;
        player.y  += player.vy * dtf;
      }

      // Ground collision
      if (player.y >= groundY) {
        player.y    = groundY;
        player.vy   = 0;
        player.grounded = true;
      }

      // Animation state
      const next = getAnimState(player, keys);
      if (next !== player.animState) {
        player.animState   = next;
        player.animElapsed = 0;
      } else {
        player.animElapsed += dt;
      }
    }

    // ── CAMERA ───────────────────────────────────────────────────
    function createCamera() {
      return { x: 0 };
    }

    function updateCamera(camera, player, canvasW, worldWidth) {
      // Keep player at 40% from left — more world visible ahead when walking right
      const target = player.x - canvasW * 0.4;
      camera.x = clamp(target, 0, worldWidth - canvasW);
    }

    // ── BOOTSTRAP ────────────────────────────────────────────────
    const canvas = document.getElementById('game');
    const ctx    = canvas.getContext('2d');
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;

    const bgImg = new Image();
    let loadedCount = 0;

    // jump_0 is a near-empty artifact frame — use only jump_1 and jump_2
    const FRAME_FILES = {
      walk:   ['walk_0', 'walk_1', 'walk_2', 'walk_3', 'walk_4'],
      jump:   ['jump_1', 'jump_2'],
      crouch: ['crouch_0', 'crouch_1', 'crouch_2'],
    };
    const TOTAL_IMAGES = 1 + 5 + 2 + 3;  // bg + walk + jump + crouch

    function onImageLoad() {
      if (++loadedCount < TOTAL_IMAGES) return;
      document.getElementById('loading').style.display = 'none';
      init();
    }

    bgImg.onload  = onImageLoad;
    bgImg.onerror = () => { document.getElementById('loading').textContent = 'Error loading background'; };
    bgImg.src     = 'img/1 Houston.png';

    for (const [anim, names] of Object.entries(FRAME_FILES)) {
      for (const name of names) {
        const img = new Image();
        img.onload  = onImageLoad;
        img.onerror = () => { document.getElementById('loading').textContent = `Error loading ${name}`; };
        img.src     = `img/frames/${name}.png`;
        FRAMES[anim].push(img);
      }
    }

    function init() {
      // Build world
      WORLD = [{
        image: bgImg,
        width: 4096,
        layers: [
          { srcYStart: 0.00, srcYEnd: 0.38, speed: 0.05 },
          { srcYStart: 0.30, srcYEnd: 0.58, speed: 0.20 },
          { srcYStart: 0.55, srcYEnd: 0.77, speed: 0.50 },
          { srcYStart: 0.77, srcYEnd: 1.00, speed: 0.90 },
        ],
      }];

      const groundY = GROUND_FRAC * canvas.height;
      const player  = createPlayer(groundY);
      const camera  = createCamera();
      const zone    = WORLD[0];

      let lastTime = 0;

      function gameLoop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // cap at 50ms
        lastTime  = timestamp;

        // Update
        updatePlayer(player, keys, dt, groundY, zone.width);
        updateCamera(camera, player, canvas.width, zone.width);

        // Render
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false;
        renderWorld(ctx, zone, camera.x, canvas.width, canvas.height);
        renderPlayer(ctx, player, camera.x, canvas.height);

        requestAnimationFrame(gameLoop);
      }

      // Skip first frame's dt spike
      requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(gameLoop); });
    }
  </script>
</body>
</html>
