<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Tests</title>
<style>
  body { font-family: monospace; padding: 20px; background: #111; color: #ccc; }
  .pass { color: #4caf50; }
  .fail { color: #f44336; }
  h2    { margin: 16px 0 8px; color: #fff; }
</style>
</head>
<body>
<h1>Unit Tests</h1>
<div id="out"></div>
<script>
  let passed = 0, failed = 0;

  function assert(label, got, expected) {
    const ok  = JSON.stringify(got) === JSON.stringify(expected);
    const div = document.createElement('div');
    div.className = ok ? 'pass' : 'fail';
    div.textContent = (ok ? '✓ ' : '✗ ') + label
      + (ok ? '' : `  →  got ${JSON.stringify(got)}, expected ${JSON.stringify(expected)}`);
    document.getElementById('out').appendChild(div);
    ok ? passed++ : failed++;
  }

  function section(name) {
    const h = document.createElement('h2');
    h.textContent = name;
    document.getElementById('out').appendChild(h);
  }

  // ── Copy utility functions here (keep in sync with index.html) ─
  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function getAnimFrame(frameCount, elapsed, fps) { return Math.floor(elapsed * fps) % frameCount; }
  function getParallaxDrawX(cameraX, speed, scaledImgW) {
    const offset = cameraX * speed;
    return ((-offset % scaledImgW) + scaledImgW) % scaledImgW - scaledImgW;
  }

  // ── clamp ────────────────────────────────────────────────────
  section('clamp');
  assert('below range',  clamp(-5,  0, 10), 0);
  assert('above range',  clamp(15,  0, 10), 10);
  assert('at min',       clamp(0,   0, 10), 0);
  assert('at max',       clamp(10,  0, 10), 10);
  assert('within range', clamp(5,   0, 10), 5);

  // ── getAnimFrame ─────────────────────────────────────────────
  section('getAnimFrame');
  assert('frame 0 at t=0',               getAnimFrame(5, 0,     8), 0);
  assert('frame 1 at t=0.125s (8fps)',   getAnimFrame(5, 0.125, 8), 1);
  assert('frame 4 at t=0.5s',           getAnimFrame(5, 0.5,   8), 4);
  assert('wraps to 0 at t=0.625s',       getAnimFrame(5, 0.625, 8), 0);
  assert('frame 0 for jump at t=0',      getAnimFrame(3, 0,     8), 0);
  assert('frame 2 for jump at t=0.25s', getAnimFrame(3, 0.25,  8), 2);

  // ── getParallaxDrawX ─────────────────────────────────────────
  section('getParallaxDrawX (scaledImgW=500)');
  const W = 500;
  // At cameraX=0: offset=0, result=-500 (loop draws at -500 then 0 — image starts at left edge)
  assert('cameraX=0, speed=0.5', getParallaxDrawX(0, 0.5, W), -W);
  // At cameraX=100, speed=0.5: offset=50, image shifts 50px left; result=-50
  assert('cameraX=100, speed=0.5', getParallaxDrawX(100, 0.5, W), -50);
  // At cameraX=1000, speed=0.5: offset=500=W, wraps back to -W
  assert('cameraX=1000, speed=0.5 (full cycle)', getParallaxDrawX(1000, 0.5, W), -W);
  // Slower layer moves less
  const slow = getParallaxDrawX(200, 0.1, W);
  const fast = getParallaxDrawX(200, 0.9, W);
  assert('slower layer moves less than faster', slow > fast, true);

  // ── updatePlayer (physics) ───────────────────────────────────────
  section('updatePlayer physics');

  // Recreate player and helpers inline (no import)
  const GRAVITY_T = 0.5, JUMP_VY_T = -12, WALK_SPEED_T = 4, CHAR_W_T = 117;
  function clampT(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  function createPlayerT(groundY) {
    return { x:200, y:groundY, vy:0, grounded:true, facingLeft:false,
             jumpConsumed:false, animState:'idle', animElapsed:0 };
  }
  function updatePlayerT(player, keys, dt, groundY, worldWidth) {
    const dtf = dt * 60;
    let vx = 0;
    if (!keys.down) {
      if (keys.left)  { vx = -WALK_SPEED_T; player.facingLeft = true; }
      if (keys.right) { vx =  WALK_SPEED_T; player.facingLeft = false; }
    }
    player.x = clampT(player.x + vx * dtf, 0, worldWidth - CHAR_W_T);
    if (keys.up && player.grounded && !player.jumpConsumed) {
      player.vy = JUMP_VY_T; player.grounded = false; player.jumpConsumed = true;
    }
    if (!keys.up) player.jumpConsumed = false;
    if (!player.grounded) { player.vy += GRAVITY_T * dtf; player.y += player.vy * dtf; }
    if (player.y >= groundY) { player.y = groundY; player.vy = 0; player.grounded = true; }
  }

  const GY = 600, WW = 4096, DT = 1/60;
  // Walk right
  {
    const p = createPlayerT(GY);
    updatePlayerT(p, { left:false, right:true, up:false, down:false }, DT, GY, WW);
    assert('walk right: x increases', p.x > 200, true);
    assert('walk right: facingLeft false', p.facingLeft, false);
  }
  // Walk left
  {
    const p = createPlayerT(GY); p.x = 300;
    updatePlayerT(p, { left:true, right:false, up:false, down:false }, DT, GY, WW);
    assert('walk left: x decreases', p.x < 300, true);
    assert('walk left: facingLeft true', p.facingLeft, true);
  }
  // Left edge clamp
  {
    const p = createPlayerT(GY); p.x = 1;
    updatePlayerT(p, { left:true, right:false, up:false, down:false }, DT, GY, WW);
    assert('left edge: x clamped to 0', p.x, 0);
  }
  // Jump
  {
    const p = createPlayerT(GY);
    updatePlayerT(p, { left:false, right:false, up:true, down:false }, DT, GY, WW);
    assert('jump: no longer grounded', p.grounded, false);
    assert('jump: vy negative (moving up)', p.vy < 0, true);
    assert('jump: y decreased', p.y < GY, true);
  }
  // No double jump on held key
  {
    const p = createPlayerT(GY);
    updatePlayerT(p, { left:false, right:false, up:true, down:false }, DT, GY, WW);
    const vyAfterFirst = p.vy;
    updatePlayerT(p, { left:false, right:false, up:true, down:false }, DT, GY, WW);
    assert('no double-jump while key held', p.vy > vyAfterFirst, true); // gravity added, not reset
  }
  // Crouch disables walking
  {
    const p = createPlayerT(GY); const x0 = p.x;
    updatePlayerT(p, { left:false, right:true, up:false, down:true }, DT, GY, WW);
    assert('crouch disables walk', p.x, x0);
  }
  // Ground collision
  {
    const p = createPlayerT(GY); p.grounded = false; p.y = GY - 5; p.vy = 20;
    updatePlayerT(p, { left:false, right:false, up:false, down:false }, DT, GY, WW);
    assert('lands on ground: grounded=true', p.grounded, true);
    assert('lands on ground: y=groundY', p.y, GY);
  }

  // ── updateCamera ─────────────────────────────────────────────
  section('updateCamera');
  function clampC(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function updateCameraT(camera, player, canvasW, worldWidth) {
    camera.x = clampC(player.x - canvasW * 0.4, 0, worldWidth - canvasW);
  }
  // Near start: clamp at 0
  {
    const cam = { x: 0 };
    updateCameraT(cam, { x: 100 }, 1280, 4096);
    assert('camera clamps at left edge', cam.x, 0);
  }
  // Mid world: follows player
  {
    const cam = { x: 0 };
    updateCameraT(cam, { x: 1000 }, 1280, 4096);
    assert('camera follows player: x = 1000 - 512', cam.x, 1000 - 512);
  }
  // Near end: clamps at right edge
  {
    const cam = { x: 0 };
    updateCameraT(cam, { x: 4000 }, 1280, 4096);
    assert('camera clamps at right edge', cam.x, 4096 - 1280);
  }

  // ── Summary ──────────────────────────────────────────────────
  const summary = document.createElement('h2');
  summary.textContent = `${passed} passed, ${failed} failed`;
  summary.style.color = failed === 0 ? '#4caf50' : '#f44336';
  document.getElementById('out').appendChild(summary);
</script>
</body>
</html>
